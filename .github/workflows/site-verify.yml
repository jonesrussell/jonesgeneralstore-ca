name: Site contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      WAASEYAA_DB: ${{ runner.temp }}/jgs-site-contract.sqlite
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Initialize isolated verification database
        run: php vendor/bin/waaseyaa db:init
      - run: .ci/site-verify
      - run: php vendor/bin/phpunit tests/Unit --no-coverage
